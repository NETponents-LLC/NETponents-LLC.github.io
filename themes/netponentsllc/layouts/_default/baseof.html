<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ECF0F1;
    }

    main {
      min-height: 60vh;
    }

    /* Content wrapper for non-home pages */
    main > .container {
      background: white;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 3rem 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    main h1 {
      color: #6B5B95;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    main h2 {
      color: #6B9B9E;
      font-size: 2rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    main h3 {
      color: #2C3E50;
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    main p {
      line-height: 1.6;
      color: #555;
      margin-bottom: 1rem;
    }

    main a {
      color: #6B9B9E;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    main a:hover {
      color: #6B5B95;
    }

    main time {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    {{ partial "header.html" . }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
