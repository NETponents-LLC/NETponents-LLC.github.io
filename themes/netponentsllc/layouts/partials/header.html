<div class="wrap header-inner">
  <a class="brand" href="/">
    {{ with resources.Get "images/logo-no-background.png" }}<img src="{{ .RelPermalink }}" alt="" height="40">{{ end }}
    <span>{{ site.Title }}</span>
  </a>
  <nav aria-label="Main">
    <ul class="nav">
      {{ $current := . }}
      {{ range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent .Menu . }} aria-current="page"{{ else if $current.HasMenuCurrent .Menu . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
      <li><a class="btn btn-sm" href="/contact/">Let's Talk</a></li>
    </ul>
  </nav>
</div>
